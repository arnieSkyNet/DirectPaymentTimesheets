name: macOS synthetic SMTP Keychain verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-smtp-keychain-${{ github.ref }}
  cancel-in-progress: false
jobs:
  keychain:
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Reachable integration; original Debian build inputs are hash-verified.
          # Never use a branch tip or silently substitute another revision.
          ref: 'd3006b7c526042a7ea5a2ab5f108a2f0d393d5dd'
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate harness without accessing Keychain
        run: python -I -B -m unittest discover -s harness/scripts -p test_macos_smtp_checks.py -v
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Run synthetic native Keychain fixture
        timeout-minutes: 45
        env:
          DPT_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: python -I -B harness/scripts/macos_smtp_checks.py source
# Harness verifies both checkouts against original reviewed build-input hashes
# before its test-only overlay. Drift is a failure, never a branch-tip fallback.
# Manual only, no repository secrets, cache, artifact uploads, packaging or release.
