name: Linux package test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-packages:
    name: Build Debian package and AppImage
    runs-on: ubuntu-latest
    container: rust:1.98.1-bookworm
    timeout-minutes: 45

    steps:
      - name: Install Linux build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            libfuse2 \
            libssl-dev \
            patchelf \
            pkg-config

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate packaging files
        run: |
          bash -n packaging/linux/build-deb.sh
          bash -n packaging/linux/build-appimage.sh
          desktop-file-validate packaging/linux/direct-payment-timesheets.desktop

      - name: Run Rust test suite
        run: cargo test --locked

      - name: Build Debian package
        run: packaging/linux/build-deb.sh

      - name: Download pinned linuxdeploy
        env:
          LINUXDEPLOY_VERSION: 1-alpha-20251107-1
        run: |
          curl --fail --location --retry 3 \
            --output /usr/local/bin/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          chmod 755 /usr/local/bin/linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        env:
          LINUXDEPLOY: /usr/local/bin/linuxdeploy-x86_64.AppImage
        run: packaging/linux/build-appimage.sh

      - name: Inspect packages
        run: |
          dpkg-deb --info dist/direct-payment-timesheets_*_amd64.deb
          file dist/Direct_Payments_Timesheets-*-x86_64.AppImage
          cd dist
          sha256sum *.deb *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Upload test packages
        uses: actions/upload-artifact@v6
        with:
          name: linux-packages-test
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
