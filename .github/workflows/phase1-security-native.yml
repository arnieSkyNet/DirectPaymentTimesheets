name: Phase 1 native security verification
run-name: Phase 1 security · ${{ github.ref_name }} · ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Enter approved source SHA d7e6994cce35da069c4dda5b62c8fd0e9f6770d8; dispatch from main
        required: true
        type: string
      controlled_windows_root_diagnostics:
        description: Opt in to synthetic Windows root diagnostics after native containment passes
        required: false
        default: false
        type: boolean

      verify_about_only:
        description: Run only synthetic About read-only tests after containment prerequisites
        required: false
        default: false
        type: boolean
      compile_sqlite_containment_only:
        description: Compile and list synthetic fixtures; run only containment controls
        required: false
        default: false
        type: boolean
      controlled_sqlite_terminal_tests:
        description: Reserved; terminal execution is refused by this workflow
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase1-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      EXPECTED_SHA: 'd7e6994cce35da069c4dda5b62c8fd0e9f6770d8'
      GIT_TERMINAL_PROMPT: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main dispatch and the fixed approved source
        env:
          SELECTED_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ inputs.expected_sha }}
          SAFE_ONLY: ${{ inputs.compile_sqlite_containment_only }}
          ABOUT_ONLY: ${{ inputs.verify_about_only }}
          TERMINAL_REQUESTED: ${{ inputs.controlled_sqlite_terminal_tests }}
          ROOT_REQUESTED: ${{ inputs.controlled_windows_root_diagnostics }}
        run: |
          set -euo pipefail
          test "$SELECTED_REF" = refs/heads/main
          test "$TERMINAL_REQUESTED" = false
          if [[ "$SAFE_ONLY" == true ]]; then test "$ROOT_REQUESTED" = false; fi
          if [[ "$ABOUT_ONLY" == true ]]; then
            test "$SAFE_ONLY" = false
            test "$ROOT_REQUESTED" = false
          fi
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = 'd7e6994cce35da069c4dda5b62c8fd0e9f6770d8'
          remote_line="$(git -c credential.helper= ls-remote --exit-code --heads \
            https://github.com/arnieSkyNet/DirectPaymentTimesheets.git \
            refs/heads/security/v1.0.7-phase1)"
          test "$remote_line" = $'d7e6994cce35da069c4dda5b62c8fd0e9f6770d8\trefs/heads/security/v1.0.7-phase1'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arnieSkyNet/DirectPaymentTimesheets
          # Fetch only the immutable approved source, not main or a branch tip.
          ref: 'd7e6994cce35da069c4dda5b62c8fd0e9f6770d8'
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Verify checkout HEAD and recheck the remote source tip
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd7e6994cce35da069c4dda5b62c8fd0e9f6770d8'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          remote_line="$(git -c credential.helper= ls-remote --exit-code --heads \
            https://github.com/arnieSkyNet/DirectPaymentTimesheets.git \
            refs/heads/security/v1.0.7-phase1)"
          test "$remote_line" = $'d7e6994cce35da069c4dda5b62c8fd0e9f6770d8\trefs/heads/security/v1.0.7-phase1'
      - name: Install the project's pinned native Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require synthetic harness guards and native Windows containment
        id: synthetic_guards
        if: ${{ !inputs.compile_sqlite_containment_only && !inputs.verify_about_only }}
        env:
          NATIVE_RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          python -I -B - <<'PYTHON'
          import os
          import unittest
          suite = unittest.defaultTestLoader.discover('scripts', pattern='test_phase1_security_checks.py')
          def cases(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item
          tests = list(cases(suite))
          windows = os.environ['NATIVE_RUNNER'] == 'windows-2022'
          if windows:
              if os.name != 'nt': raise SystemExit('Containment requires native Windows')
              expected = {
                  'test_phase1_security_checks.NativeContainmentTests.test_breakaway_is_refused',
                  'test_phase1_security_checks.NativeContainmentTests.test_child_grandchild_timeout_releases_exclusive_handle',
                  'test_phase1_security_checks.NativeContainmentTests.test_normal_exit_cleans_descendant',
              }
              if {test.id() for test in tests if '.NativeContainmentTests.' in test.id()} != expected: raise SystemExit('Containment fixture inventory mismatch')
          if not tests: raise SystemExit('No harness guards discovered')
          allowed = set() if windows else {
              'test_phase1_security_checks.NativeContainmentTests.test_breakaway_is_refused',
              'test_phase1_security_checks.NativeContainmentTests.test_child_grandchild_timeout_releases_exclusive_handle',
              'test_phase1_security_checks.NativeContainmentTests.test_normal_exit_cleans_descendant',
          }
          class PrerequisiteResult(unittest.TextTestResult):
              def addSkip(self, test, reason):
                  super().addSkip(test, reason)
                  if test.id() not in allowed or reason != 'Requires native Windows Job Objects':
                      self.stop()
          result = unittest.TextTestRunner(verbosity=2, failfast=True, resultclass=PrerequisiteResult).run(suite)
          if result.shouldStop or not result.wasSuccessful() or result.testsRun != len(tests) or {test.id() for test, _ in result.skipped} != allowed:
              raise SystemExit('Synthetic prerequisites refused')
          PYTHON
      - name: Compile and run isolated synthetic security tests
        if: ${{ !inputs.compile_sqlite_containment_only && !inputs.verify_about_only && success() && steps.synthetic_guards.outcome == 'success' }}
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
          NATIVE_RUNNER: ${{ matrix.runner }}
          ROOT_DIAGNOSTICS_REQUESTED: ${{ inputs.controlled_windows_root_diagnostics }}
        run: |
          set -euo pipefail
          # The approved harness activates root queries only for its scoped Phase 1 fixture.
          # Compilation, other groups and production admission never activate diagnostics.
          if [[ "$NATIVE_RUNNER" == windows-2022 && "$ROOT_DIAGNOSTICS_REQUESTED" == true ]]; then
            env -u DPT_WINDOWS_ROOT_DIAGNOSTICS DPT_WINDOWS_SYNTHETIC_ROOT_DIAGNOSTICS=1 python -I -B scripts/phase1_security_checks.py
          else
            env -u DPT_WINDOWS_ROOT_DIAGNOSTICS -u DPT_WINDOWS_SYNTHETIC_ROOT_DIAGNOSTICS python -I -B scripts/phase1_security_checks.py
          fi
      - name: Compile synthetic SQLite fixture without execution
        if: ${{ inputs.compile_sqlite_containment_only && success() }}
        timeout-minutes: 30
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
        run: |
          set -euo pipefail
          mkdir -p target
          env -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u DPT_SYNTHETIC_SQLITE_TERMINAL_TESTS -u DPT_WINDOWS_ROOT_DIAGNOSTICS -u DPT_WINDOWS_SYNTHETIC_ROOT_DIAGNOSTICS cargo test --locked --test native_sqlite_terminal_fixtures --no-run --message-format=json > target/native-sqlite-build.jsonl
      - name: Verify ignored inventory without executing fixtures
        if: ${{ inputs.compile_sqlite_containment_only && success() }}
        timeout-minutes: 1
        run: |
          python -I -B - <<'PYTHON'
          import json, os, pathlib, subprocess
          target = pathlib.Path('target').resolve()
          records = [json.loads(line) for line in (target / 'native-sqlite-build.jsonl').read_text().splitlines()]
          artifacts = [r for r in records if r.get('reason') == 'compiler-artifact' and r.get('target', {}).get('name') == 'native_sqlite_terminal_fixtures']
          if len(artifacts) != 1: raise SystemExit('fixture_inventory_mismatch')
          artifact = artifacts[0]
          if artifact['target']['kind'] != ['test'] or artifact.get('profile', {}).get('test') is not True or not artifact.get('executable'): raise SystemExit('fixture_inventory_mismatch')
          executable = pathlib.Path(artifact['executable']).resolve()
          if not executable.is_relative_to(target) or not executable.is_file(): raise SystemExit('fixture_inventory_mismatch')
          env = {k: os.environ[k] for k in ('SystemRoot', 'WINDIR', 'PATH', 'TEMP', 'TMP') if k in os.environ}
          try:
              result = subprocess.run([str(executable), '--list', '--ignored'], env=env, capture_output=True, text=True, timeout=10)
          except (OSError, subprocess.TimeoutExpired):
              raise SystemExit('fixture_inventory_unconfirmed') from None
          if result.returncode or result.stderr or [s.strip() for s in result.stdout.splitlines() if s.strip()] != ['native_child: test', '1 test, 0 benchmarks']: raise SystemExit('fixture_inventory_mismatch')
          print('native.sqlite: inventory_verified=true; terminal_executed=false')
          PYTHON
      - name: Require strict native containment only
        id: strict_containment
        if: ${{ (inputs.compile_sqlite_containment_only || inputs.verify_about_only) && success() }}
        timeout-minutes: 2
        env:
          NATIVE_RUNNER: ${{ matrix.runner }}
        run: |
          python -I -B - <<'PYTHON'
          import os, pathlib, runpy, sys
          keep = ('SystemRoot', 'WINDIR', 'PATH', 'TEMP', 'TMP', 'EXPECTED_SHA', 'NATIVE_RUNNER', 'GITHUB_ACTIONS', 'GITHUB_REF')
          env = {k: os.environ[k] for k in keep if k in os.environ}
          env.update(DPT_NATIVE_SQLITE_SAFE_CONTAINMENT='1', DPT_SYNTHETIC_REPORT_RISK='disposable-synthetic-only')
          os.environ.clear()
          os.environ.update(env)
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          sys.argv = ['native_sqlite_terminal_checks.py', '--containment-only']
          runpy.run_path('scripts/native_sqlite_terminal_checks.py', run_name='__main__')
          PYTHON
      - name: Discover and run only exact synthetic About tests
        if: ${{ inputs.verify_about_only && success() && steps.strict_containment.outcome == 'success' }}
        timeout-minutes: 30
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
          NATIVE_RUNNER: ${{ matrix.runner }}
        run: |
          python -I -B - <<'PYTHON'
          import json, os, platform, re, subprocess, sys, tempfile
          from pathlib import Path
          runners = {('Windows', 'AMD64'): 'windows-2022', ('Darwin', 'x86_64'): 'macos-15-intel', ('Darwin', 'arm64'): 'macos-15'}
          key = (platform.system(), platform.machine())
          if key not in runners or runners[key] != os.environ.get('NATIVE_RUNNER'): raise SystemExit('unsupported_platform')
          windows = platform.system() == 'Windows'
          expected = {
              'gui::about_windows_database_tests::about_windows_unavailable_preserves_missing_and_refused_database',
              'private_storage::platform::about_read_only_policy_tests::about_windows_dacl_assessor_refuses_untrusted_allow_without_repair',
              'private_storage::windows_verification_tests::about_windows_foreign_root_owner_refusal_preserves_fixture',
              'private_storage::windows_verification_tests::about_windows_missing_database_is_not_created',
              'private_storage::windows_verification_tests::about_windows_reparse_database_ancestor_and_sidecars_are_refused',
          } if windows else {
              'database::about_read_only_tests::database_ancestor_and_sidecar_symlinks_are_refused',
              'database::about_read_only_tests::live_wal_committed_metadata_remains_readable',
              'database::about_read_only_tests::missing_database_is_not_created',
              'database::about_read_only_tests::ordinary_access_is_read_only_and_preserves_database',
              'gui::about_database_tests::about_displays_existing_schema_without_migration',
              'gui::about_database_tests::about_preserves_unavailable_on_open_and_query_failure',
          }
          keep = ('SystemRoot', 'WINDIR', 'PATH', 'TEMP', 'TMP', 'HOME', 'USERPROFILE', 'CARGO_HOME', 'RUSTUP_HOME', 'SDKROOT', 'DEVELOPER_DIR', 'ProgramFiles', 'ProgramFiles(x86)', 'ProgramW6432', 'SystemDrive')
          env = {k: os.environ[k] for k in keep if k in os.environ}
          env.update(RUSTUP_TOOLCHAIN='1.98.1', CARGO_INCREMENTAL='0', CARGO_BUILD_JOBS='2', CARGO_PROFILE_TEST_DEBUG='0')
          phases = ('entry', 'pathname', 'vswhere', 'vsdevcmd', 'sdk', 'linker_metadata')
          operations = ('join_path', 'full_path', 'get_item', 'attributes', 'parent')
          def marker_snapshot(raw):
              observed, count, last, pending = [], 0, None, None
              valid = len(raw) <= 262144
              for line in raw.decode('ascii', errors='replace').splitlines():
                  if line.startswith('DPT_MSVC_PHASE:') and line.removeprefix('DPT_MSVC_PHASE:') in phases:
                      observed.append(line.removeprefix('DPT_MSVC_PHASE:'))
                  else:
                      match = re.fullmatch(r'DPT_MSVC_OP:(join_path|full_path|get_item|attributes|parent):(before|after):([0-9]{1,2})', line)
                      if not match or int(match[3]) >= 32:
                          valid = False
                          continue
                      operation, edge, depth = match[1], match[2], int(match[3])
                      count += 1
                      if count > 4096: valid = False
                      if edge == 'before':
                          if pending is not None: valid = False
                          pending = (operation, depth)
                      else:
                          if pending != (operation, depth): valid = False
                          pending = None
                      last = {'operation':operation, 'edge':edge, 'depth':depth}
              ordered = observed == list(phases[:len(observed)])
              return observed if ordered else [], last, count, valid and ordered, pending
          def native_code(error):
              code = getattr(error, 'winerror', None)
              return code if isinstance(code, int) and not isinstance(code, bool) else None
          def tool_query(args, env, timeout, discovery=False):
              # Read only a bounded snapshot of regular-file output, including on
              # failure. Never publish raw tool output or exception text.
              with tempfile.TemporaryFile() as out, tempfile.TemporaryFile() as err:
                  def evidence(classification, error=None, killed=False, reaped=False, exit_code=None):
                      err.seek(0)
                      raw = err.read(262145)
                      observed, last, count, valid, pending = marker_snapshot(raw) if discovery else ([], None, 0, True, None)
                      record = {'class':classification, 'native_code':native_code(error), 'exit_code':exit_code, 'deadline_seconds':timeout, 'leader_killed':killed, 'leader_reaped':reaped, 'descendant_cleanup_confirmed':False, 'markers_valid':valid, 'phases':observed, 'last_operation':last, 'operation_count':count}
                      print(json.dumps(record, sort_keys=True))
                  try:
                      process = subprocess.Popen(args, env=env, stdout=out, stderr=err)
                  except OSError as error:
                      evidence('msvc_launch_failed', error)
                      raise SystemExit('msvc_launch_failed') from None
                  try:
                      code = process.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      try: process.kill()
                      except OSError as error:
                          evidence('msvc_leader_kill_failed', error)
                          raise SystemExit('msvc_leader_kill_failed') from None
                      try: process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          evidence('msvc_leader_reap_timeout', killed=True)
                          raise SystemExit('msvc_leader_reap_timeout') from None
                      except OSError as error:
                          evidence('msvc_leader_reap_failed', error, killed=True)
                          raise SystemExit('msvc_leader_reap_failed') from None
                      evidence('msvc_query_timeout', killed=True, reaped=True)
                      raise SystemExit('msvc_query_timeout') from None
                  except OSError as error:
                      # Wait failure leaves leader state uncertain; fail closed.
                      evidence('msvc_wait_failed', error)
                      raise SystemExit('msvc_wait_failed') from None
                  evidence('msvc_query_completed', reaped=True, exit_code=code)
                  out.seek(0)
                  err.seek(0)
                  stdout, stderr = out.read(65537), err.read(262145)
                  if len(stdout) > 65536 or len(stderr) > 262144: raise SystemExit('msvc_output_limit')
                  if discovery:
                      observed, last, count, valid, pending = marker_snapshot(stderr)
                      if not valid or observed != list(phases) or pending is not None or count == 0: raise SystemExit('msvc_marker_output_refused')
                  return subprocess.CompletedProcess(args, code, stdout.decode('utf-8', errors='replace'), stderr.decode('utf-8', errors='replace'))
          def windows_toolchain(base):
              # Installed runner tools only. Capture configuration internally;
              # never print developer-environment values or arbitrary PATH entries.
              script = r'''
          $ErrorActionPreference = 'Stop'
          [Console]::Error.WriteLine('DPT_MSVC_PHASE:entry')
          function Require-LocalAbsolute($path) {
            if (!$path -or $path -notmatch '^[A-Za-z]:\\' -or $path.Substring(2) -match '[":%!?&|<>\r\n]' -or $path -match '(?:^|\\)(?:CON|PRN|AUX|NUL|COM[1-9¹²³]|LPT[1-9¹²³])(?:\.[^\\]*)?(?:\\|$)') { throw 'nonlocal_or_unsafe_path' }
          }
          function Trace-Operation($operation, $edge, [int]$depth) {
            if ($operation -notin @('join_path','full_path','get_item','attributes','parent') -or $edge -notin @('before','after') -or $depth -lt 0 -or $depth -ge 32) { throw 'invalid_operation_record' }
            [Console]::Error.WriteLine(('DPT_MSVC_OP:{0}:{1}:{2}' -f $operation,$edge,$depth))
          }
          function Join-LocalPath($base, $child) {
            Require-LocalAbsolute $base
            if ([IO.Path]::IsPathRooted($child) -or $child -match '[":%!?&|<>\r\n]') { throw 'unsafe_child_path' }
            Trace-Operation 'join_path' 'before' 0
            $joined = Join-Path $base $child
            Trace-Operation 'join_path' 'after' 0
            Require-LocalAbsolute $joined
            return $joined
          }
          function Require-PlainPath($path) {
            Require-LocalAbsolute $path
            Trace-Operation 'full_path' 'before' 0
            $full = [IO.Path]::GetFullPath($path)
            Trace-Operation 'full_path' 'after' 0
            Require-LocalAbsolute $full
            $root = $full.Substring(0,3)
            $current = if ($full.Length -gt 3) { $full.TrimEnd('\') } else { $full }
            $seen = @{}
            for ($depth = 0; $depth -lt 32; $depth++) {
              if ($seen.ContainsKey($current)) { throw 'path_cycle' }
              $seen[$current] = $true
              Trace-Operation 'get_item' 'before' $depth
              $entry = Get-Item -LiteralPath $current -Force
              Trace-Operation 'get_item' 'after' $depth
              Trace-Operation 'attributes' 'before' $depth
              $attributes = $entry.Attributes
              Trace-Operation 'attributes' 'after' $depth
              if ($null -eq $attributes -or ($attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'reparse_or_unconfirmed_path' }
              if ($current -eq $root) { return $full }
              Trace-Operation 'parent' 'before' $depth
              $parent = [IO.Path]::GetDirectoryName($current)
              Trace-Operation 'parent' 'after' $depth
              Require-LocalAbsolute $parent
              if ($parent.Length -ge $current.Length -or !$current.StartsWith(($parent.TrimEnd('\') + '\'), [StringComparison]::OrdinalIgnoreCase)) { throw 'path_nonprogress' }
              $current = $parent
            }
            throw 'path_depth_exceeded'
          }
          $pf = ${env:ProgramFiles(x86)}
          if (!$pf) { throw 'missing_discovery_root' }
          [Console]::Error.WriteLine('DPT_MSVC_PHASE:pathname')
          $vswhere = Require-PlainPath (Join-LocalPath $pf 'Microsoft Visual Studio\Installer\vswhere.exe')
          [Console]::Error.WriteLine('DPT_MSVC_PHASE:vswhere')
          $raw = & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json
          if ($LASTEXITCODE -ne 0) { throw 'discovery_failed' }
          $instances = ConvertFrom-Json -InputObject ($raw -join "`n")
          if ($instances.Count -ne 1) { throw 'ambiguous_or_missing_toolchain' }
          $root = Require-PlainPath $instances[0].installationPath
          $allowedRoots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:ProgramW6432) | Where-Object { $_ }
          if (!($allowedRoots | Where-Object { $root.StartsWith((Join-LocalPath $_ 'Microsoft Visual Studio\'), [StringComparison]::OrdinalIgnoreCase) })) { throw 'untrusted_installation' }
          $dev = Require-PlainPath (Join-LocalPath $root 'Common7\Tools\VsDevCmd.bat')
          if (!(Test-Path -LiteralPath $dev -PathType Leaf)) { throw 'missing_developer_environment' }
          [Console]::Error.WriteLine('DPT_MSVC_PHASE:vsdevcmd')
          $output = & "$env:SystemRoot\System32\cmd.exe" /d /s /c "`"`"$dev`" -arch=x64 -host_arch=x64 >nul && set`""
          if ($LASTEXITCODE -ne 0) { throw 'developer_environment_failed' }
          $values = @{}
          foreach ($line in $output) {
            $pair = $line.Split('=', 2)
            if ($pair.Count -eq 2) { $values[$pair[0].ToUpperInvariant()] = $pair[1] }
          }
          if ($values['VSCMD_ARG_TGT_ARCH'] -ne 'x64' -or $values['VSCMD_ARG_HOST_ARCH'] -ne 'x64') { throw 'wrong_architecture' }
          $tools = Require-PlainPath $values['VCTOOLSINSTALLDIR']
          if (!$tools.StartsWith(($root.TrimEnd('\') + '\VC\Tools\MSVC\'), [StringComparison]::OrdinalIgnoreCase)) { throw 'untrusted_tools' }
          if ((Require-PlainPath $values['VSINSTALLDIR']).TrimEnd('\') -ne $root.TrimEnd('\')) { throw 'installation_mismatch' }
          [Console]::Error.WriteLine('DPT_MSVC_PHASE:sdk')
          $sdk = Require-PlainPath $values['WINDOWSSDKDIR']
          if (!($allowedRoots | Where-Object { $sdk.StartsWith((Join-LocalPath $_ 'Windows Kits\'), [StringComparison]::OrdinalIgnoreCase) })) { throw 'untrusted_sdk' }
          foreach ($key in @('VCINSTALLDIR','WINDOWSSDKBINPATH','WINDOWSSDKVERBINPATH','UNIVERSALCRTSDKDIR')) {
            if ($values[$key]) {
              $candidate = Require-PlainPath $values[$key]
              if (!$candidate.StartsWith(($root.TrimEnd('\') + '\'), [StringComparison]::OrdinalIgnoreCase) -and !$candidate.StartsWith(($sdk.TrimEnd('\') + '\'), [StringComparison]::OrdinalIgnoreCase) -and $candidate.TrimEnd('\') -ne $sdk.TrimEnd('\')) { throw 'untrusted_toolchain_variable' }
            }
          }
          [Console]::Error.WriteLine('DPT_MSVC_PHASE:linker_metadata')
          $link = Require-PlainPath (Join-LocalPath $tools 'bin\Hostx64\x64\link.exe')
          Trace-Operation 'get_item' 'before' 0
          $item = Get-Item -LiteralPath $link
          Trace-Operation 'get_item' 'after' 0
          Trace-Operation 'attributes' 'before' 0
          $linkAttributes = $item.Attributes
          Trace-Operation 'attributes' 'after' 0
          if ($null -eq $linkAttributes -or ($linkAttributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'reparse_linker' }
          $version = $item.VersionInfo
          if ($version.CompanyName -ne 'Microsoft Corporation' -or $version.ProductName -notmatch 'Visual Studio') { throw 'incompatible_linker' }
          $keep = @('PATH','INCLUDE','LIB','LIBPATH','VSINSTALLDIR','VCINSTALLDIR','VCTOOLSINSTALLDIR','WINDOWSSDKDIR','WINDOWSSDKVERSION','WINDOWSSDKBINPATH','WINDOWSSDKVERBINPATH','UNIVERSALCRTSDKDIR','UCRTVERSION','VSCMD_ARG_TGT_ARCH','VSCMD_ARG_HOST_ARCH')
          $envOut = @{}
          foreach ($key in $keep) { if ($values.ContainsKey($key)) { $envOut[$key] = $values[$key] } }
          @{environment=$envOut; linker=$link; root=$root; company=$version.CompanyName; product=$version.ProductName; version=$version.FileVersion} | ConvertTo-Json -Depth 3 -Compress
          '''
              # These trusted setup-tool deadlines do not prove descendant-tree
              # cleanup; any timeout stops the step without retries or About tests.
              powershell = os.path.join(base['SystemRoot'], 'System32', 'WindowsPowerShell', 'v1.0', 'powershell.exe')
              try:
                  discovery = tool_query([powershell, '-NoProfile', '-NonInteractive', '-Command', script], base, 30, discovery=True)
              except OSError as error:
                  print(json.dumps({'class':'msvc_discovery_os_error','native_code':native_code(error),'deadline_seconds':30,'leader_killed':False,'leader_reaped':False,'descendant_cleanup_confirmed':False}, sort_keys=True))
                  raise SystemExit('msvc_discovery_os_error') from None
              if discovery.returncode: raise SystemExit('msvc_discovery_refused')
              try:
                  data = json.loads(discovery.stdout)
              except (ValueError, TypeError): raise SystemExit('msvc_discovery_invalid') from None
              if not isinstance(data, dict) or not all(isinstance(data.get(k), str) for k in ('linker','root','company','product','version')) or not isinstance(data.get('environment'), dict): raise SystemExit('msvc_discovery_invalid')
              allowed = {'PATH','INCLUDE','LIB','LIBPATH','VSINSTALLDIR','VCINSTALLDIR','VCTOOLSINSTALLDIR','WINDOWSSDKDIR','WINDOWSSDKVERSION','WINDOWSSDKBINPATH','WINDOWSSDKVERBINPATH','UNIVERSALCRTSDKDIR','UCRTVERSION','VSCMD_ARG_TGT_ARCH','VSCMD_ARG_HOST_ARCH'}
              config = data['environment']
              if set(config) - allowed or any(not isinstance(v, str) for v in config.values()): raise SystemExit('msvc_environment_refused')
              if any(not config.get(k) for k in ('PATH','INCLUDE','LIB','LIBPATH','VCTOOLSINSTALLDIR','WINDOWSSDKDIR')): raise SystemExit('msvc_environment_incomplete')
              linker = Path(data['linker'])
              root = Path(data['root'])
              if not root.is_absolute() or not linker.is_absolute() or not linker.is_relative_to(root / 'VC' / 'Tools' / 'MSVC') or linker.parts[-4:] != ('bin', 'Hostx64', 'x64', 'link.exe') or data['company'] != 'Microsoft Corporation' or 'Visual Studio' not in data['product']: raise SystemExit('msvc_linker_refused')
              if config.get('VSCMD_ARG_TGT_ARCH') != 'x64' or config.get('VSCMD_ARG_HOST_ARCH') != 'x64': raise SystemExit('msvc_architecture_refused')
              config['PATH'] = str(linker.parent) + os.pathsep + config['PATH']
              config['CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER'] = str(linker)
              configured = base | config
              try:
                  help_result = tool_query([str(linker), '/?'], configured, 5)
                  rust = tool_query(['rustc', '-vV'], configured, 5)
              except (OSError, subprocess.TimeoutExpired): raise SystemExit('msvc_identity_unconfirmed') from None
              if help_result.returncode or 'Microsoft' not in help_result.stdout + help_result.stderr or rust.returncode or 'host: x86_64-pc-windows-msvc' not in rust.stdout: raise SystemExit('msvc_identity_refused')
              print(json.dumps({'class':'msvc_verified','linker':str(linker),'product':data['product'],'version':data['version'],'host':'x86_64-pc-windows-msvc','target':'x86_64-pc-windows-msvc','discovery_code':discovery.returncode,'help_code':help_result.returncode,'rust_code':rust.returncode,'required_present':{k:bool(config.get(k)) for k in ('INCLUDE','LIB','LIBPATH','WINDOWSSDKDIR')}}, sort_keys=True))
              return configured
          if windows:
              env.pop('SDKROOT', None)
              env.pop('DEVELOPER_DIR', None)
              env = windows_toolchain(env)
          listing_args = ['cargo', 'test', '--locked', '--bin', 'direct_payment_timesheets', 'about_', '--', '--list']
          execution_args = ['cargo', 'test', '--locked', '--bin', 'direct_payment_timesheets', 'about_', '--', '--test-threads=1']
          try:
              listing = subprocess.run(listing_args, env=env, capture_output=True, text=True, timeout=1200)
          except (OSError, subprocess.TimeoutExpired): raise SystemExit('about_inventory_unconfirmed') from None
          names = [line[:-6] for line in listing.stdout.splitlines() if line.endswith(': test')]
          if listing.returncode:
              print(listing.stderr, file=sys.stderr)
              raise SystemExit('about_inventory_compilation_failed')
          if len(names) != len(expected) or set(names) != expected: raise SystemExit('about_inventory_mismatch')
          # Plain trusted Cargo execution is step-bounded; no descendant cleanup
          # claim is made on timeout. Stop the job; do not retry or run later tests.
          try:
              result = subprocess.run(execution_args, env=env, capture_output=True, text=True, timeout=300)
          except (OSError, subprocess.TimeoutExpired): raise SystemExit('about_execution_unconfirmed_cleanup') from None
          print(result.stdout)
          summary = re.findall(r'test result: ok[.] (\d+) passed; (\d+) failed; (\d+) ignored;', result.stdout)
          # libtest emits "test NAME ... ok"; reject duplicate/absent/ignored cases.
          completed = re.findall(r'^test (.+) \.\.\. ok$', result.stdout, re.M)
          if result.returncode or summary != [(str(len(expected)), '0', '0')] or len(completed) != len(expected) or set(completed) != expected: raise SystemExit('about_tests_failed_or_incomplete')
          if windows:
              print('about: class=refusal_ui_evaluator_verified; positive_ordinary_wal_verified=false; staging_cleanup_verified=false')
          else:
              print('about: class=ordinary_and_live_wal_verified; pathname_confinement_verified=false')
          PYTHON
      - name: Explain the verification boundary
        if: always()
        run: |
          echo 'Native verification is not remediation or release approval.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect compilation, every test group, and known failing assertions in docs/NATIVE-SECURITY-VERIFICATION.md.' >> "$GITHUB_STEP_SUMMARY"
# No push/PR/tag/release/workflow_call trigger, publisher, packaging, cache,
# secrets, deployment environment, artifact upload or production application run.
