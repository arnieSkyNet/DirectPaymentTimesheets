name: Phase 1 native security verification
run-name: Phase 1 security · ${{ github.ref_name }} · ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Enter approved source SHA d7e6994cce35da069c4dda5b62c8fd0e9f6770d8; dispatch from main
        required: true
        type: string
      controlled_windows_root_diagnostics:
        description: Opt in to synthetic Windows root diagnostics after native containment passes
        required: false
        default: false
        type: boolean

      verify_about_only:
        description: Run only synthetic About read-only tests after containment prerequisites
        required: false
        default: false
        type: boolean
      compile_sqlite_containment_only:
        description: Compile and list synthetic fixtures; run only containment controls
        required: false
        default: false
        type: boolean
      controlled_sqlite_terminal_tests:
        description: Reserved; terminal execution is refused by this workflow
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase1-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      EXPECTED_SHA: 'd7e6994cce35da069c4dda5b62c8fd0e9f6770d8'
      GIT_TERMINAL_PROMPT: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main dispatch and the fixed approved source
        env:
          SELECTED_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ inputs.expected_sha }}
          SAFE_ONLY: ${{ inputs.compile_sqlite_containment_only }}
          ABOUT_ONLY: ${{ inputs.verify_about_only }}
          TERMINAL_REQUESTED: ${{ inputs.controlled_sqlite_terminal_tests }}
          ROOT_REQUESTED: ${{ inputs.controlled_windows_root_diagnostics }}
        run: |
          set -euo pipefail
          test "$SELECTED_REF" = refs/heads/main
          test "$TERMINAL_REQUESTED" = false
          if [[ "$SAFE_ONLY" == true ]]; then test "$ROOT_REQUESTED" = false; fi
          if [[ "$ABOUT_ONLY" == true ]]; then
            test "$SAFE_ONLY" = false
            test "$ROOT_REQUESTED" = false
          fi
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = 'd7e6994cce35da069c4dda5b62c8fd0e9f6770d8'
          remote_line="$(git -c credential.helper= ls-remote --exit-code --heads \
            https://github.com/arnieSkyNet/DirectPaymentTimesheets.git \
            refs/heads/security/v1.0.7-phase1)"
          test "$remote_line" = $'d7e6994cce35da069c4dda5b62c8fd0e9f6770d8\trefs/heads/security/v1.0.7-phase1'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arnieSkyNet/DirectPaymentTimesheets
          # Fetch only the immutable approved source, not main or a branch tip.
          ref: 'd7e6994cce35da069c4dda5b62c8fd0e9f6770d8'
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Verify checkout HEAD and recheck the remote source tip
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd7e6994cce35da069c4dda5b62c8fd0e9f6770d8'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          remote_line="$(git -c credential.helper= ls-remote --exit-code --heads \
            https://github.com/arnieSkyNet/DirectPaymentTimesheets.git \
            refs/heads/security/v1.0.7-phase1)"
          test "$remote_line" = $'d7e6994cce35da069c4dda5b62c8fd0e9f6770d8\trefs/heads/security/v1.0.7-phase1'
      - name: Install the project's pinned native Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require synthetic harness guards and native Windows containment
        id: synthetic_guards
        if: ${{ !inputs.compile_sqlite_containment_only && !inputs.verify_about_only }}
        env:
          NATIVE_RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          python -I -B - <<'PYTHON'
          import os
          import unittest
          suite = unittest.defaultTestLoader.discover('scripts', pattern='test_phase1_security_checks.py')
          def cases(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item
          tests = list(cases(suite))
          windows = os.environ['NATIVE_RUNNER'] == 'windows-2022'
          if windows:
              if os.name != 'nt': raise SystemExit('Containment requires native Windows')
              expected = {
                  'test_phase1_security_checks.NativeContainmentTests.test_breakaway_is_refused',
                  'test_phase1_security_checks.NativeContainmentTests.test_child_grandchild_timeout_releases_exclusive_handle',
                  'test_phase1_security_checks.NativeContainmentTests.test_normal_exit_cleans_descendant',
              }
              if {test.id() for test in tests if '.NativeContainmentTests.' in test.id()} != expected: raise SystemExit('Containment fixture inventory mismatch')
          if not tests: raise SystemExit('No harness guards discovered')
          allowed = set() if windows else {
              'test_phase1_security_checks.NativeContainmentTests.test_breakaway_is_refused',
              'test_phase1_security_checks.NativeContainmentTests.test_child_grandchild_timeout_releases_exclusive_handle',
              'test_phase1_security_checks.NativeContainmentTests.test_normal_exit_cleans_descendant',
          }
          class PrerequisiteResult(unittest.TextTestResult):
              def addSkip(self, test, reason):
                  super().addSkip(test, reason)
                  if test.id() not in allowed or reason != 'Requires native Windows Job Objects':
                      self.stop()
          result = unittest.TextTestRunner(verbosity=2, failfast=True, resultclass=PrerequisiteResult).run(suite)
          if result.shouldStop or not result.wasSuccessful() or result.testsRun != len(tests) or {test.id() for test, _ in result.skipped} != allowed:
              raise SystemExit('Synthetic prerequisites refused')
          PYTHON
      - name: Compile and run isolated synthetic security tests
        if: ${{ !inputs.compile_sqlite_containment_only && !inputs.verify_about_only && success() && steps.synthetic_guards.outcome == 'success' }}
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
          NATIVE_RUNNER: ${{ matrix.runner }}
          ROOT_DIAGNOSTICS_REQUESTED: ${{ inputs.controlled_windows_root_diagnostics }}
        run: |
          set -euo pipefail
          # The approved harness activates root queries only for its scoped Phase 1 fixture.
          # Compilation, other groups and production admission never activate diagnostics.
          if [[ "$NATIVE_RUNNER" == windows-2022 && "$ROOT_DIAGNOSTICS_REQUESTED" == true ]]; then
            env -u DPT_WINDOWS_ROOT_DIAGNOSTICS DPT_WINDOWS_SYNTHETIC_ROOT_DIAGNOSTICS=1 python -I -B scripts/phase1_security_checks.py
          else
            env -u DPT_WINDOWS_ROOT_DIAGNOSTICS -u DPT_WINDOWS_SYNTHETIC_ROOT_DIAGNOSTICS python -I -B scripts/phase1_security_checks.py
          fi
      - name: Compile synthetic SQLite fixture without execution
        if: ${{ inputs.compile_sqlite_containment_only && success() }}
        timeout-minutes: 30
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
        run: |
          set -euo pipefail
          mkdir -p target
          env -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u DPT_SYNTHETIC_SQLITE_TERMINAL_TESTS -u DPT_WINDOWS_ROOT_DIAGNOSTICS -u DPT_WINDOWS_SYNTHETIC_ROOT_DIAGNOSTICS cargo test --locked --test native_sqlite_terminal_fixtures --no-run --message-format=json > target/native-sqlite-build.jsonl
      - name: Verify ignored inventory without executing fixtures
        if: ${{ inputs.compile_sqlite_containment_only && success() }}
        timeout-minutes: 1
        run: |
          python -I -B - <<'PYTHON'
          import json, os, pathlib, subprocess
          target = pathlib.Path('target').resolve()
          records = [json.loads(line) for line in (target / 'native-sqlite-build.jsonl').read_text().splitlines()]
          artifacts = [r for r in records if r.get('reason') == 'compiler-artifact' and r.get('target', {}).get('name') == 'native_sqlite_terminal_fixtures']
          if len(artifacts) != 1: raise SystemExit('fixture_inventory_mismatch')
          artifact = artifacts[0]
          if artifact['target']['kind'] != ['test'] or artifact.get('profile', {}).get('test') is not True or not artifact.get('executable'): raise SystemExit('fixture_inventory_mismatch')
          executable = pathlib.Path(artifact['executable']).resolve()
          if not executable.is_relative_to(target) or not executable.is_file(): raise SystemExit('fixture_inventory_mismatch')
          env = {k: os.environ[k] for k in ('SystemRoot', 'WINDIR', 'PATH', 'TEMP', 'TMP') if k in os.environ}
          try:
              result = subprocess.run([str(executable), '--list', '--ignored'], env=env, capture_output=True, text=True, timeout=10)
          except (OSError, subprocess.TimeoutExpired):
              raise SystemExit('fixture_inventory_unconfirmed') from None
          if result.returncode or result.stderr or [s.strip() for s in result.stdout.splitlines() if s.strip()] != ['native_child: test', '1 test, 0 benchmarks']: raise SystemExit('fixture_inventory_mismatch')
          print('native.sqlite: inventory_verified=true; terminal_executed=false')
          PYTHON
      - name: Require strict native containment only
        id: strict_containment
        if: ${{ (inputs.compile_sqlite_containment_only || inputs.verify_about_only) && success() }}
        timeout-minutes: 2
        env:
          NATIVE_RUNNER: ${{ matrix.runner }}
        run: |
          python -I -B - <<'PYTHON'
          import os, pathlib, runpy, sys
          keep = ('SystemRoot', 'WINDIR', 'PATH', 'TEMP', 'TMP', 'EXPECTED_SHA', 'NATIVE_RUNNER', 'GITHUB_ACTIONS', 'GITHUB_REF')
          env = {k: os.environ[k] for k in keep if k in os.environ}
          env.update(DPT_NATIVE_SQLITE_SAFE_CONTAINMENT='1', DPT_SYNTHETIC_REPORT_RISK='disposable-synthetic-only')
          os.environ.clear()
          os.environ.update(env)
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          sys.argv = ['native_sqlite_terminal_checks.py', '--containment-only']
          runpy.run_path('scripts/native_sqlite_terminal_checks.py', run_name='__main__')
          PYTHON
      - name: Discover and run only exact synthetic About tests
        if: ${{ inputs.verify_about_only && success() && steps.strict_containment.outcome == 'success' }}
        timeout-minutes: 30
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
          NATIVE_RUNNER: ${{ matrix.runner }}
        run: |
          python -I -B - <<'PYTHON'
          import json, os, platform, re, subprocess, sys, tempfile
          from pathlib import Path
          runners = {('Windows', 'AMD64'): 'windows-2022', ('Darwin', 'x86_64'): 'macos-15-intel', ('Darwin', 'arm64'): 'macos-15'}
          key = (platform.system(), platform.machine())
          if key not in runners or runners[key] != os.environ.get('NATIVE_RUNNER'): raise SystemExit('unsupported_platform')
          windows = platform.system() == 'Windows'
          expected = {
              'gui::about_windows_database_tests::about_windows_unavailable_preserves_missing_and_refused_database',
              'private_storage::platform::about_read_only_policy_tests::about_windows_dacl_assessor_refuses_untrusted_allow_without_repair',
              'private_storage::windows_verification_tests::about_windows_foreign_root_owner_refusal_preserves_fixture',
              'private_storage::windows_verification_tests::about_windows_missing_database_is_not_created',
              'private_storage::windows_verification_tests::about_windows_reparse_database_ancestor_and_sidecars_are_refused',
          } if windows else {
              'database::about_read_only_tests::database_ancestor_and_sidecar_symlinks_are_refused',
              'database::about_read_only_tests::live_wal_committed_metadata_remains_readable',
              'database::about_read_only_tests::missing_database_is_not_created',
              'database::about_read_only_tests::ordinary_access_is_read_only_and_preserves_database',
              'gui::about_database_tests::about_displays_existing_schema_without_migration',
              'gui::about_database_tests::about_preserves_unavailable_on_open_and_query_failure',
          }
          keep = ('SystemRoot', 'WINDIR', 'PATH', 'TEMP', 'TMP', 'HOME', 'USERPROFILE', 'CARGO_HOME', 'RUSTUP_HOME', 'SDKROOT', 'DEVELOPER_DIR', 'ProgramFiles', 'ProgramFiles(x86)', 'ProgramW6432', 'SystemDrive')
          env = {k: os.environ[k] for k in keep if k in os.environ}
          env.update(RUSTUP_TOOLCHAIN='1.98.1', CARGO_INCREMENTAL='0', CARGO_BUILD_JOBS='2', CARGO_PROFILE_TEST_DEBUG='0')
          phases = ('entry', 'module_init', 'module_load', 'module_ready', 'pathname', 'vswhere', 'vsdevcmd', 'sdk', 'linker_metadata')
          operations = ('join_path', 'full_path', 'get_item', 'attributes', 'parent')
          status_order = [('vswhere','before'), ('vswhere','after'), ('json','before'), ('json','after'), ('instances','before'), ('instances','after')]
          developer_success = [{'observation':'before'},{'observation':'completed','native_status':0,'stderr_present':False,'stderr_bounds_valid':True,'capture_valid':True},{'observation':'cleanup','leader_killed':False,'leader_reaped':True,'readers_stopped':True,'stop_reason':'none','stdout_bounds_valid':True,'total_bounds_valid':True,'cleanup_valid':True,'descendant_cleanup_confirmed':False},{'observation':'environment_validated'}]
          def marker_snapshot(raw):
              observed, count, last, pending, statuses = [], 0, None, None, []
              bounded, sequence, malformed, unexpected = len(raw) <= 262144, True, False, False
              failure = None
              developer, developer_failure = [], None
              for line in raw.decode('ascii', errors='replace').splitlines():
                  if failure is not None or developer_failure is not None: sequence = False
                  if line == 'DPT_MSVC_DEV:before':
                      if developer or observed != list(phases[:7]) or statuses != [{'stage':stage,'edge':edge,'code':1 if stage == 'instances' and edge == 'after' else 0} for stage,edge in status_order] or pending is not None:
                          sequence = False
                          continue
                      developer.append({'observation':'before'})
                      continue
                  result = re.fullmatch(r'DPT_MSVC_DEV:result:(completed|interrupted):(none|-?(?:0|[1-9][0-9]{0,9})):(0|1):(0|1):(0|1)', line)
                  if result:
                      status = None if result[2] == 'none' else int(result[2])
                      if status is not None and not -2147483648 <= status <= 2147483647: malformed = True
                      if result[4] == '0' and result[3] != '1': malformed = True
                      if len(developer) != 1 or observed != list(phases[:7]) or pending is not None:
                          sequence = False
                          continue
                      developer.append({'observation':result[1], 'native_status':status, 'stderr_present':result[3] == '1', 'stderr_bounds_valid':result[4] == '1', 'capture_valid':result[5] == '1'})
                      continue
                  cleanup = re.fullmatch(r'DPT_MSVC_DEV:cleanup:(0|1):(0|1):(0|1):(none|stream_overflow|timeout|cancelled|capture_failed|invocation_failed):(0|1):(0|1):(0|1)', line)
                  if cleanup:
                      if len(developer) != 2 or observed != list(phases[:7]) or pending is not None:
                          sequence = False
                          continue
                      result = developer[1]
                      killed, reaped, readers = cleanup[1] == '1', cleanup[2] == '1', cleanup[3] == '1'
                      if (result['native_status'] is not None and not reaped) or (result['observation'] == 'completed') != reaped: malformed = True
                      if killed and cleanup[4] == 'none': malformed = True
                      developer.append({'observation':'cleanup', 'leader_killed':killed, 'leader_reaped':reaped, 'readers_stopped':readers, 'stop_reason':cleanup[4], 'stdout_bounds_valid':cleanup[5] == '1', 'total_bounds_valid':cleanup[6] == '1', 'cleanup_valid':cleanup[7] == '1', 'descendant_cleanup_confirmed':False})
                      continue
                  if line == 'DPT_MSVC_DEV:environment:validated':
                      if developer != developer_success[:3] or observed != list(phases[:7]) or pending is not None:
                          sequence = False
                          continue
                      developer.append({'observation':'environment_validated'})
                      continue
                  refusal = re.fullmatch(r'DPT_MSVC_DEV_FAILURE:(invocation_failed|status_unconfirmed|native_nonzero|unexpected_stderr|environment_capture_failed|environment_malformed|environment_duplicate|architecture_mismatch|tool_path_refused|stream_overflow|query_timeout|cancelled|cleanup_failed|invalid_decoding)', line)
                  if refusal:
                      classification = refusal[1]
                      if observed != list(phases[:7]) or not developer or len(developer) > 3: sequence = False
                      if len(developer) not in (1,3) or (len(developer) == 1 and classification != 'tool_path_refused'): sequence = False
                      if len(developer) == 3:
                          result, cleanup = developer[1:]
                          status, reason = result['native_status'], cleanup['stop_reason']
                          good_cleanup = cleanup['cleanup_valid'] and cleanup['readers_stopped']
                          capture_bounded = result['stderr_bounds_valid'] and cleanup['stdout_bounds_valid'] and cleanup['total_bounds_valid']
                          if classification == 'cleanup_failed':
                              if cleanup['cleanup_valid'] or result['capture_valid']: sequence = False
                          elif not good_cleanup: sequence = False
                          if good_cleanup and not cleanup['leader_reaped'] and (cleanup['leader_killed'] or status is not None or classification not in ('invocation_failed','query_timeout','cancelled')): sequence = False
                          if classification in ('stream_overflow','query_timeout','cancelled'):
                              if reason != {'stream_overflow':'stream_overflow','query_timeout':'timeout','cancelled':'cancelled'}[classification] or result['capture_valid']: sequence = False
                              if classification == 'stream_overflow' and capture_bounded: sequence = False
                          elif classification == 'invocation_failed':
                              if reason not in ('none','invocation_failed') or result['capture_valid']: sequence = False
                              if reason == 'none' and (result['observation'] != 'interrupted' or status is not None): sequence = False
                          elif classification == 'environment_capture_failed':
                              if reason not in ('none','capture_failed'): sequence = False
                              if reason == 'none' and (status != 0 or result['stderr_present']): sequence = False
                          elif classification != 'cleanup_failed':
                              if reason != 'none' or not capture_bounded or not cleanup['leader_reaped']: sequence = False
                              if classification == 'status_unconfirmed' and status is not None: sequence = False
                              if classification == 'native_nonzero' and (status is None or status == 0): sequence = False
                              if classification == 'unexpected_stderr' and (status != 0 or not result['stderr_present']): sequence = False
                              if classification in ('environment_malformed','environment_duplicate','architecture_mismatch','tool_path_refused','invalid_decoding') and (status != 0 or result['stderr_present']): sequence = False
                              if classification in ('status_unconfirmed','native_nonzero','unexpected_stderr','invalid_decoding') and result['capture_valid']: sequence = False
                              if classification in ('environment_duplicate','architecture_mismatch','tool_path_refused') and not result['capture_valid']: sequence = False
                      developer_failure = classification
                      continue
                  refusal = re.fullmatch(r'DPT_MSVC_FAILURE:(invocation_failed|status_unconfirmed|native_nonzero):(none|-?(?:0|[1-9][0-9]{0,9}))', line)
                  if refusal:
                      classification, token = refusal[1], refusal[2]
                      value = None if token == 'none' else int(token)
                      if classification == 'native_nonzero':
                          if value is None or value == 0 or not -2147483648 <= value <= 2147483647: malformed = True
                      elif classification == 'status_unconfirmed' and value is not None: malformed = True
                      elif value is not None and not -2147483648 <= value <= 2147483647: malformed = True
                      if observed != list(phases[:6]) or statuses != [{'stage':'vswhere','edge':'before','code':0}] or pending is not None or count == 0: sequence = False
                      failure = {'class':classification,'vswhere_native_status':value}
                      continue
                  if line.startswith('DPT_MSVC_PHASE:'):
                      phase = line.removeprefix('DPT_MSVC_PHASE:')
                      if phase not in phases: malformed = True
                      elif len(observed) >= len(phases) or phase != phases[len(observed)]: sequence = False
                      else: observed.append(phase)
                      continue
                  status = re.fullmatch(r'DPT_MSVC_STATUS:(vswhere|json|instances):(before|after):(-?[0-9]{1,10})', line)
                  if status:
                      stage, edge, value = status[1], status[2], int(status[3])
                      if not -2147483648 <= value <= 4294967295: malformed = True
                      elif len(statuses) >= len(status_order) or (stage,edge) != status_order[len(statuses)]: sequence = False
                      elif edge == 'before' and value != 0: malformed = True
                      else: statuses.append({'stage':stage, 'edge':edge, 'code':value})
                      continue
                  match = re.fullmatch(r'DPT_MSVC_OP:(join_path|full_path|get_item|attributes|parent):(before|after):([0-9]{1,2})', line)
                  if not match or int(match[3]) >= 32:
                      if line.startswith(('DPT_MSVC_OP:', 'DPT_MSVC_STATUS:', 'DPT_MSVC_DEV:', 'DPT_MSVC_DEV_FAILURE:')): malformed = True
                      else: unexpected = True
                      continue
                  operation, edge, depth = match[1], match[2], int(match[3])
                  count += 1
                  if count > 4096: bounded = False
                  if edge == 'before':
                      if pending is not None: sequence = False
                      pending = (operation, depth)
                  else:
                      if pending != (operation, depth): sequence = False
                      pending = None
                  last = {'operation':operation, 'edge':edge, 'depth':depth}
              return {'phases':observed, 'last_operation':last, 'operation_count':count, 'operation_pending':pending is not None, 'statuses':statuses, 'markers_valid':bounded and sequence and not malformed and not unexpected, 'bounds_valid':bounded, 'sequence_valid':sequence, 'malformed_markers':malformed, 'unexpected_output':unexpected, 'failure':failure, 'developer':developer, 'developer_failure':developer_failure}
          def native_code(error):
              code = getattr(error, 'winerror', None)
              return code if isinstance(code, int) and not isinstance(code, bool) else None
          def linker_snapshot_diagnostics(stdout, stderr, completed):
              # Evidence only: never used by identity acceptance. Input snapshots
              # are capped before decoding; no path, message or matched text escapes.
              # The existing Microsoft substring predicate remains an unresolved
              # identity-assurance limitation; these flags are not security proof.
              # Completed/reaped leader evidence does not prove descendant silence.
              record = dict(classification='unknown', canonical_banner=False,
                  usage_heading=False, options_structure=False, usage_signal=False,
                  error_signal=False, warning_signal=False, diagnostic_family='none',
                  unknown_output=True, malformed_output=False, decoding_checked=False,
                  decoding_valid=False, stdout_present=False, stderr_present=False,
                  stdout_bounds_valid=False, stderr_bounds_valid=False,
                  snapshot_incomplete=True, snapshot_read_valid=True, parser_valid=True)
              try:
                  if type(stdout) is not bytes or type(stderr) is not bytes or type(completed) is not bool: raise ValueError()
                  record.update(stdout_present=bool(stdout),stderr_present=bool(stderr),stdout_bounds_valid=len(stdout) <= 65536,stderr_bounds_valid=len(stderr) <= 262144,snapshot_incomplete=not completed)
                  if not record['stdout_bounds_valid'] or not record['stderr_bounds_valid']:
                      record.update(classification='malformed',malformed_output=True,snapshot_incomplete=True)
                      return record
                  record['decoding_checked'] = True
                  try: texts = (stdout.decode('utf-8',errors='strict'),stderr.decode('utf-8',errors='strict'))
                  except UnicodeError:
                      record.update(classification='malformed',malformed_output=True)
                      return record
                  record['decoding_valid'] = True
                  record['snapshot_incomplete'] |= any(text and not text.endswith(('\n','\r')) for text in texts)
                  record['malformed_output'] = any(re.search(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]',text) for text in texts)
                  banner = r'(?im)^[ \t]{0,128}Microsoft \(R\) Incremental Linker Version [0-9]{1,5}(?:\.[0-9]{1,5}){1,4}[ \t]*\r?$'
                  heading = r'(?im)^[ \t]{0,128}usage:[ \t]+LINK(?:\.exe)?[ \t]+\[options\][ \t]+\[files\](?:[ \t]+\[@commandfile\])?[ \t]*\r?$'
                  record['canonical_banner'] = any(re.search(banner,text) is not None for text in texts)
                  record['usage_heading'] = any(re.search(heading,text) is not None for text in texts)
                  options = tuple(any(re.search(r'(?im)^[ \t]{0,128}/' + option + r'(?:[: \t]|\r?$)',text) is not None for text in texts) for option in ('OUT','MACHINE','NOLOGO'))
                  record['options_structure'] = sum(options) >= 2
                  record['usage_signal'] = record['canonical_banner'] and record['usage_heading'] and record['options_structure']
                  # Usage prose mentioning errors/warnings is not a diagnostic.
