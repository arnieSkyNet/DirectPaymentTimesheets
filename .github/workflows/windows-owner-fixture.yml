name: Windows owner-query fixture (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-owner:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify synthetic owner queries on Windows x64
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-windows-owner-fixture.ps1
