[package]
name = "direct_payment_timesheets"
version = "1.0.7"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ArnieSkyNet/DirectPaymentTimesheets"
# Local rendering experiments are not Cargo targets or distributable sources.
autoexamples = false
exclude = ["examples/windows_email_preview.rs", "tools/windows-email-preview/**"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
windows-dev-isolation = []

[dependencies]
rusqlite = { version = "0.31", features = ["backup", "bundled", "functions", "hooks"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
chrono = "0.4.45"
eframe = "0.33"
egui = "0.33"
pdf-extract = "0.7"
rfd = "0.15"
printpdf = { version = "0.8", features = ["png", "jpeg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zune-jpeg = "0.5"
zune-core = "0.5"
unicode-normalization = "0.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "tokio1-native-tls"] }
zip = "2.2"
sha2 = "0.10"

ureq = { version = "3", features = ["json"] }
semver = "1"

tempfile = "3"
same-file = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
native-tls = "0.2"
lopdf = { version = "0.35", default-features = false }
